name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-policy:
    name: Verificar conservación de builds
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Pruebas de limpieza y publicación
        working-directory: .github/scripts
        run: python3 -m unittest test_prune_artifacts test_publish_latest_build

  check:
    name: Analizar y probar
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Flutter (stable) con caché
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Revisar formato
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test

  build:
    name: Compilar APK
    needs: check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter (stable) con caché
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Compilar APK de depuración
        run: flutter build apk --debug

      - name: Subir artefacto (APK)
        uses: actions/upload-artifact@v7
        with:
          name: fat-fish-mobile-apk
          retention-days: 7
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  release:
    name: Actualizar última descarga
    needs: [build, artifact-policy]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Descargar el build comprobado de esta ejecución
        uses: actions/download-artifact@v7
        with:
          name: fat-fish-mobile-apk
          path: release-input

      - name: Publicar y reemplazar la descarga anterior
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_latest_build.py --source release-input --name fat-fish-mobile.apk
