name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analizar y probar
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Flutter (stable) con caché
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Revisar formato
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test

  build:
    name: Compilar APK
    needs: check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter (stable) con caché
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Compilar APK de depuración
        run: flutter build apk --debug

      - name: Subir artefacto (APK)
        uses: actions/upload-artifact@v7
        with:
          name: fat-fish-mobile-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
