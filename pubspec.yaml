name: fat_fish_mobile
description: "App móvil de Fat Fish"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audio_session: ^0.2.4
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_soloud: ^5.2.3
  go_router: ^18.1.1
  http: ^1.6.0
  package_info_plus: ^10.2.2
  sentry_flutter: ^10.2.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  drift_dev: ^2.35.2
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/fat_fish.png
    - assets/images/mesa.jpg
    - assets/sonidos/

  fonts:
    - family: Jersey10
      fonts:
        - asset: assets/fonts/Jersey10-Regular.ttf
    # Press Start 2P with full-height accented capitals (tool/fuente_pixel.py).
    - family: FatFishPixel
      fonts:
        - asset: assets/fonts/FatFishPixel-Regular.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
        - asset: assets/fonts/CourierPrime-Bold.ttf
          weight: 700

# App icon: regenerate with `dart run flutter_launcher_icons` after changing assets/icon.
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#0B1416"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0B1416"
